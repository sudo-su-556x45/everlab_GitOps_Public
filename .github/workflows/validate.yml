name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Portfolio validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/requirements-ansible.txt
            .github/requirements-kubernetes.txt

      - name: Install Python validation dependencies
        run: |
          python -m pip install \
            --requirement .github/requirements-ansible.txt \
            --requirement .github/requirements-kubernetes.txt

      - name: Install required Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Install pinned validation binaries
        env:
          TOOLS_DIRECTORY: ${{ runner.temp }}/bin
          DOWNLOAD_DIRECTORY: ${{ runner.temp }}/downloads
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS_DIRECTORY}" "${DOWNLOAD_DIRECTORY}"

          download_and_verify() {
            local url="$1"
            local output="$2"
            local checksum="$3"
            curl --fail --location --silent --show-error \
              --output "${output}" "${url}"
            echo "${checksum}  ${output}" | sha256sum --check --status
          }

          download_and_verify \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" \
            "${DOWNLOAD_DIRECTORY}/kustomize.tar.gz" \
            "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8"
          download_and_verify \
            "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
            "${DOWNLOAD_DIRECTORY}/kubeconform.tar.gz" \
            "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          download_and_verify \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            "${DOWNLOAD_DIRECTORY}/gitleaks.tar.gz" \
            "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          download_and_verify \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            "${DOWNLOAD_DIRECTORY}/actionlint.tar.gz" \
            "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

          tar -xf "${DOWNLOAD_DIRECTORY}/kustomize.tar.gz" \
            -C "${TOOLS_DIRECTORY}" kustomize
          tar -xf "${DOWNLOAD_DIRECTORY}/kubeconform.tar.gz" \
            -C "${TOOLS_DIRECTORY}" kubeconform
          tar -xf "${DOWNLOAD_DIRECTORY}/gitleaks.tar.gz" \
            -C "${TOOLS_DIRECTORY}" gitleaks
          tar -xf "${DOWNLOAD_DIRECTORY}/actionlint.tar.gz" \
            -C "${TOOLS_DIRECTORY}" actionlint
          echo "${TOOLS_DIRECTORY}" >> "${GITHUB_PATH}"

      - name: Validate GitOps and text invariants
        run: |
          python scripts/validate_gitops.py
          python scripts/validate_text.py
          yamllint kubernetes .github/workflows

      - name: Build and validate every Kustomization
        run: scripts/validate_kustomize.sh

      - name: Validate Ansible and rendered worker networking
        run: scripts/validate_ansible.sh

      - name: Validate security and repository tooling
        run: |
          gitleaks dir --config .gitleaks.toml --redact --no-banner .
          actionlint .github/workflows/validate.yml
          shellcheck scripts/*.sh
          python3 - <<'PY'
          from xml.etree import ElementTree

          ElementTree.parse("docs/everlab-infrastructure.svg")
          print("Infrastructure SVG is valid XML")
          PY
