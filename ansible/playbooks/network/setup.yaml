---
- name: Collect temporary DHCP addresses
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: temporary_host_mappings
      prompt: >-
        Enter inventory hosts and current DHCP IPs
        (host=ip,host=ip)
      private: false

    - name: reboot_after_networking
      prompt: "Reboot after applying network configuration? true or false"
      private: false
      default: "true"

  tasks:
    - name: Parse temporary host mappings
      ansible.builtin.set_fact:
        parsed_host_mappings: >-
          {{
            temporary_host_mappings
            | split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Validate temporary host mappings
      ansible.builtin.assert:
        that:
          - parsed_host_mappings | length > 0
          - item is match(
              '^[A-Za-z0-9_.-]+=[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
            )
        fail_msg: >-
          Invalid mapping "{{ item }}". Use host=ip,host=ip format.
      loop: "{{ parsed_host_mappings }}"

    - name: Restrict static networking to current Kubernetes workers
      ansible.builtin.assert:
        that:
          - item.split('=', 1)[0] in groups['k8s_workers']
        fail_msg: >-
          {{ item.split('=', 1)[0] }} is not a current Kubernetes worker.
          This playbook only configures hosts in k8s_workers.
      loop: "{{ parsed_host_mappings }}"

    - name: Add hosts using temporary DHCP addresses
      ansible.builtin.add_host:
        name: "{{ item.split('=', 1)[0] }}"
        groups: temporary_network_targets

        ansible_host: "{{ item.split('=', 1)[1] }}"
        ansible_user: "{{ bootstrap_user }}"
        ansible_password: "{{ bootstrap_password }}"
        ansible_become_password: "{{ bootstrap_password }}"
        ansible_ssh_private_key_file: ""
        ansible_ssh_common_args: >-
          -o ProxyCommand=none
          -o PreferredAuthentications=password
          -o PubkeyAuthentication=no
          -o StrictHostKeyChecking=accept-new

        permanent_management_ip: >-
          {{
            hostvars[item.split('=', 1)[0]].ansible_host
          }}

        permanent_k8s_ip: >-
          {{
            hostvars[item.split('=', 1)[0]].k8s_cluster_ip
          }}
      loop: "{{ parsed_host_mappings }}"
      no_log: true

    - name: Store reboot selection
      ansible.builtin.set_fact:
        network_reboot_requested: "{{ reboot_after_networking | bool }}"


- name: Configure static Debian VLAN networking
  hosts: temporary_network_targets
  gather_facts: false
  become: true

  vars:
    node_last_octet: >-
      {{
        permanent_k8s_ip.split('.')[-1]
      }}

    management_static_ip: >-
      192.168.{{ k8s_network_management_vlan }}.{{ node_last_octet }}

    kubernetes_static_ip: >-
      192.168.{{ k8s_network_cluster_vlan }}.{{ node_last_octet }}

    applications_static_ip: >-
      192.168.{{ k8s_network_load_balancer_vlan }}.{{ node_last_octet }}

    nfs_static_ip: >-
      192.168.{{ k8s_network_storage_vlan }}.{{ node_last_octet }}

    pv_static_ip: >-
      192.168.{{ k8s_network_pv_vlan }}.{{ node_last_octet }}

  pre_tasks:
    - name: Validate permanent inventory variables
      ansible.builtin.assert:
        that:
          - permanent_management_ip is defined
          - permanent_management_ip | string | length > 0
          - permanent_k8s_ip is defined
          - permanent_k8s_ip | string | length > 0
          - node_last_octet | int > 0
          - node_last_octet | int < 255
          - k8s_network_physical_interface | length > 0
          - k8s_network_prefix | int > 0
          - k8s_network_management_gateway | length > 0
          - k8s_network_dns_servers | length > 0
          - k8s_network_load_balancer_gateway | length > 0
          - k8s_network_load_balancer_routes | length > 0
        fail_msg: >-
          {{ inventory_hostname }} must define ansible_host and
          k8s_cluster_ip in inventory.

    - name: Validate derived management address
      ansible.builtin.assert:
        that:
          - permanent_management_ip == management_static_ip
        fail_msg: >-
          Inventory ansible_host for {{ inventory_hostname }} is
          {{ permanent_management_ip }}, but the derived management
          address is {{ management_static_ip }}.

    - name: Verify physical interface exists
      ansible.builtin.raw: >-
        ip link show {{ k8s_network_physical_interface }}
      changed_when: false

  tasks:
    - name: Back up existing network configuration
      ansible.builtin.copy:
        src: /etc/network/interfaces
        dest: /etc/network/interfaces.pre-ansible
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Configure static VLAN networking
      ansible.builtin.template:
        src: interfaces.j2
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: "0644"
      register: network_configuration

    - name: Configure temporary bootstrap DNS
      ansible.builtin.raw: |
        set -eu

        cat > /etc/resolv.conf <<'EOF'
        {% for dns_server in k8s_network_dns_servers %}
        nameserver {{ dns_server }}
        {% endfor %}
        EOF
      register: bootstrap_dns_result
      changed_when: false

    - name: Reboot into permanent network configuration
      ansible.builtin.reboot:
        reboot_timeout: 30
        test_command: /bin/true
      when:
        - network_configuration.changed
        - hostvars['localhost']['network_reboot_requested'] | bool
      ignore_unreachable: true

    - name: Restart networking without reboot
      ansible.builtin.command:
        argv:
          - systemctl
          - restart
          - networking
      async: 1
      poll: 0
      when:
        - network_configuration.changed
        - not hostvars['localhost']['network_reboot_requested'] | bool
