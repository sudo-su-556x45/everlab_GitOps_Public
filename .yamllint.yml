---
extends: default

rules:
  brackets:
    max-spaces-inside: 1
  colons:
    max-spaces-after: 2
  comments-indentation: false
  document-start: disable
  empty-lines:
    max-end: 1
  indentation:
    indent-sequences: whatever
  line-length:
    max: 120
    level: warning
  new-line-at-end-of-file: disable
  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: false
