apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"

spec:
  project: default

  source:
    repoURL: https://github.com/sudo-su-556x45/everlab_GitOps_Public.git
    targetRevision: main
    path: kubernetes/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
