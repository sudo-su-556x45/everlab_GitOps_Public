apiVersion: v1
kind: Service
metadata:
  name: openbao-metrics
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-metrics
    app.kubernetes.io/part-of: openbao
spec:
  selector:
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/name: openbao
    component: server

  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: everlab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-metrics
      app.kubernetes.io/part-of: openbao

  endpoints:
    - port: metrics
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 30s
      scrapeTimeout: 10s
