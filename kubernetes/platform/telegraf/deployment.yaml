apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: telegraf
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: telegraf

  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegraf

    spec:
      containers:
        - name: telegraf
          image: telegraf:1.36
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: telegraf-secrets

          volumeMounts:
            - name: config
              mountPath: /etc/telegraf

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: telegraf-config
