apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"

spec:
  project: default

  sources:
    - repoURL: quay.io/jetstack/charts
      chart: trust-manager
      targetRevision: "v0.24.0"

      helm:
        releaseName: trust-manager
        valueFiles:
          - $values/kubernetes/platform/trust-manager/values.yaml

    - repoURL: https://github.com/sudo-su-556x45/everlab_GitOps_Public.git
      targetRevision: main
      path: kubernetes/platform/trust-manager
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
