apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: everlab

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: n8n

  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: everlab

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.32.7
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          env:
            - name: N8N_HOST
              value: n8n.prod.everlab.dev

            - name: N8N_PORT
              value: "5678"

            - name: N8N_PROTOCOL
              value: https

            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.prod.everlab.dev

            - name: WEBHOOK_URL
              value: https://n8n.prod.everlab.dev/

            - name: N8N_PROXY_HOPS
              value: "1"

            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"

            - name: N8N_RUNNERS_ENABLED
              value: "true"

            - name: N8N_METRICS
              value: "true"

            - name: N8N_METRICS_INCLUDE_DEFAULT_METRICS
              value: "true"

            - name: N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL
              value: "true"

            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: filesystem

            - name: GENERIC_TIMEZONE
              value: America/Denver

            - name: TZ
              value: America/Denver

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
