apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-synapse
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix
    app.kubernetes.io/part-of: everlab
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: matrix

  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix
        app.kubernetes.io/part-of: everlab

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: render-config
          image: ghcr.io/element-hq/synapse:v1.159.0
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -c
            - |
              import os
              from pathlib import Path

              template = Path("/template/homeserver.yaml").read_text()
              template = template.replace("__POSTGRES_USER__", os.environ["POSTGRES_USER"])
              template = template.replace("__POSTGRES_PASSWORD__", os.environ["POSTGRES_PASSWORD"])
              Path("/data/homeserver.yaml").write_text(template)

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: matrix-postgres-app
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-postgres-app
                  key: password

          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true

            - name: data
              mountPath: /data

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.159.0
          imagePullPolicy: IfNotPresent

          args:
            - run

          ports:
            - name: http
              containerPort: 8008
              protocol: TCP

            - name: metrics
              containerPort: 9000
              protocol: TCP

          env:
            - name: TZ
              value: America/Denver

          volumeMounts:
            - name: data
              mountPath: /data

            - name: temporary
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: config-template
          configMap:
            name: matrix-synapse-config

        - name: data
          persistentVolumeClaim:
            claimName: matrix-synapse-data

        - name: temporary
          emptyDir: {}
