apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: music-assistant

  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-assistant
        app.kubernetes.io/part-of: media-stack

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: music-assistant
          image: ghcr.io/music-assistant/server:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: LOG_LEVEL
              value: info

          ports:
            - name: http
              containerPort: 8095
              protocol: TCP

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /data

            - name: media
              mountPath: /media
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data

        - name: media
          persistentVolumeClaim:
            claimName: media-data
            readOnly: true
