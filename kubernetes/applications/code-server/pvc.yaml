apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: code-server-projects
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: everlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

spec:
  accessModes:
    - ReadWriteMany

  storageClassName: ""
  volumeName: code-server-projects

  resources:
    requests:
      storage: 500Gi
