apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/part-of: everlab
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: frigate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: frigate
        app.kubernetes.io/part-of: everlab

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: initialize-config
          image: busybox:1.37
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /config/config.yml ]; then
                cp /defaults/config.yml /config/config.yml
              fi

          volumeMounts:
            - name: defaults
              mountPath: /defaults
              readOnly: true

            - name: config
              mountPath: /config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.17.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8971
              protocol: TCP

            - name: http-internal
              containerPort: 5000
              protocol: TCP

            - name: rtsp
              containerPort: 8554
              protocol: TCP

            - name: webrtc-tcp
              containerPort: 8555
              protocol: TCP

            - name: webrtc-udp
              containerPort: 8555
              protocol: UDP

          env:
            - name: TZ
              value: America/Denver

          volumeMounts:
            - name: config
              mountPath: /config

            - name: media
              mountPath: /media/frigate

            - name: cache
              mountPath: /tmp/cache

            - name: shared-memory
              mountPath: /dev/shm

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - FOWNER
              drop:
                - ALL

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi

      volumes:
        - name: defaults
          configMap:
            name: frigate-config

        - name: config
          persistentVolumeClaim:
            claimName: frigate-config

        - name: media
          persistentVolumeClaim:
            claimName: frigate-media

        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
