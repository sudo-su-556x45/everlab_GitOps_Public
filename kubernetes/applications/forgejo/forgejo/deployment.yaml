apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: everlab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/part-of: everlab

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready \
                --host=forgejo-postgres-rw \
                --port=5432 \
                --username="${POSTGRES_USER}" \
                --dbname=forgejo
              do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-user
                  key: username

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.1-rootless
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

            - name: ssh
              containerPort: 2222
              protocol: TCP

          env:
            - name: USER_UID
              value: "1000"

            - name: USER_GID
              value: "1000"

            # Database
            - name: FORGEJO__database__DB_TYPE
              value: postgres

            - name: FORGEJO__database__HOST
              value: forgejo-postgres-rw:5432

            - name: FORGEJO__database__NAME
              value: forgejo

            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-user
                  key: username

            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-user
                  key: password

            - name: FORGEJO__database__SSL_MODE
              value: disable

            # Web server
            - name: FORGEJO__server__PROTOCOL
              value: http

            - name: FORGEJO__server__HTTP_ADDR
              value: 0.0.0.0

            - name: FORGEJO__server__HTTP_PORT
              value: "3000"

            - name: FORGEJO__server__DOMAIN
              value: forgejo.prod.everlab.dev

            - name: FORGEJO__server__ROOT_URL
              value: https://forgejo.prod.everlab.dev/

            - name: FORGEJO__server__LOCAL_ROOT_URL
              value: http://127.0.0.1:3000/

            # Embedded SSH server
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"

            - name: FORGEJO__server__SSH_DOMAIN
              value: git.prod.everlab.dev

            - name: FORGEJO__server__SSH_LISTEN_HOST
              value: 0.0.0.0

            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"

            - name: FORGEJO__server__SSH_PORT
              value: "22"

            - name: FORGEJO__server__DISABLE_SSH
              value: "false"

            # Installation and account policy
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"

            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-application
                  key: secret-key

            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-application
                  key: internal-token

            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"

            - name: FORGEJO__server__LFS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-application
                  key: lfs-jwt-secret

            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "false"

            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"

            - name: FORGEJO__service__ENABLE_NOTIFY_MAIL
              value: "false"

            # Repository defaults
            - name: FORGEJO__repository__DEFAULT_PRIVATE
              value: private

            - name: FORGEJO__repository__DEFAULT_BRANCH
              value: main

            - name: FORGEJO__repository__ENABLE_PUSH_CREATE_USER
              value: "true"

            - name: FORGEJO__repository__ENABLE_PUSH_CREATE_ORG
              value: "true"

            # Privacy and external resources
            - name: FORGEJO__picture__DISABLE_GRAVATAR
              value: "true"

            - name: FORGEJO__picture__ENABLE_FEDERATED_AVATAR
              value: "false"

            - name: FORGEJO__server__OFFLINE_MODE
              value: "true"

            - name: FORGEJO__metrics__ENABLED
              value: "true"

            - name: FORGEJO__time__DEFAULT_UI_LOCATION
              value: America/Denver

            - name: TZ
              value: America/Denver

          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea

          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
