apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: everlab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja

  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/part-of: everlab

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready \
                --host=vikunja-postgres-rw \
                --port=5432 \
                --username="${POSTGRES_USER}" \
                --dbname=vikunja
              do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-user
                  key: username

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: vikunja
          image: vikunja/vikunja:2.3.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3456
              protocol: TCP

          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://vikunja.prod.everlab.dev/

            - name: VIKUNJA_SERVICE_INTERFACE
              value: ":3456"

            - name: VIKUNJA_SERVICE_TIMEZONE
              value: America/Denver

            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "true"

            - name: VIKUNJA_SERVICE_ENABLECALDAV
              value: "true"

            - name: VIKUNJA_SERVICE_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-application
                  key: jwt-secret

            - name: VIKUNJA_DATABASE_TYPE
              value: postgres

            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres-rw

            - name: VIKUNJA_DATABASE_PORT
              value: "5432"

            - name: VIKUNJA_DATABASE_DATABASE
              value: vikunja

            - name: VIKUNJA_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-user
                  key: username

            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-user
                  key: password

            - name: VIKUNJA_DATABASE_SSLMODE
              value: disable

            - name: VIKUNJA_DATABASE_MAXOPENCONNECTIONS
              value: "20"

            - name: VIKUNJA_DATABASE_MAXIDLECONNECTIONS
              value: "5"

            - name: VIKUNJA_FILES_BASEPATH
              value: /app/vikunja/files

            - name: VIKUNJA_FILES_MAXSIZE
              value: "104857600"

            - name: VIKUNJA_LOG_LEVEL
              value: INFO

            - name: VIKUNJA_LOG_HTTP
              value: stdout

            - name: VIKUNJA_LOG_DATABASE
              value: stdout

            - name: TZ
              value: America/Denver

          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files
