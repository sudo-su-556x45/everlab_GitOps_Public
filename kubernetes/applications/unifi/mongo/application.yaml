apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifi-mongo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"

spec:
  project: default

  source:
    repoURL: https://github.com/sudo-su-556x45/everlab_GitOps_Public.git
    targetRevision: main
    path: kubernetes/applications/unifi/mongo

  destination:
    server: https://kubernetes.default.svc
    namespace: unifi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
