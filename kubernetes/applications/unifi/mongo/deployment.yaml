apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mongodb
  namespace: unifi

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-mongodb

  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: unifi-mongodb
                  key: rootUsername

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-mongodb
                  key: rootPassword

            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: unifi-mongodb
                  key: username

            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongodb
                  key: password

            - name: MONGO_DBNAME
              value: unifi

            - name: MONGO_AUTHSOURCE
              value: admin

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /data/db

            - name: init
              mountPath: /docker-entrypoint-initdb.d/init-mongo.sh
              subPath: init-mongo.sh
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unifi-mongodb

        - name: init
          configMap:
            name: unifi-mongo-init
            defaultMode: 0755
