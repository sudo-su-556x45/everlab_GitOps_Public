apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wiki-js-postgres
  namespace: wiki-js
  labels:
    app.kubernetes.io/name: wiki-js-postgres
    app.kubernetes.io/part-of: wiki-js
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: wikijs
      owner: wikijs
      secret:
        name: wiki-js-postgres-user

  storage:
    storageClass: nfs
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  affinity:
    enablePodAntiAffinity: false

  monitoring:
    enablePodMonitor: true
