apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nocodb-postgres
  namespace: nocodb
  labels:
    app.kubernetes.io/name: nocodb-postgres
    app.kubernetes.io/part-of: nocodb
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: nocodb
      owner: nocodb
      secret:
        name: nocodb-postgres-user

  storage:
    storageClass: nfs
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  affinity:
    enablePodAntiAffinity: false

  monitoring:
    enablePodMonitor: true
