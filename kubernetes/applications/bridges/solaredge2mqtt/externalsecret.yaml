apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-auth
  namespace: solaredge2mqtt
  labels:
    app.kubernetes.io/name: solaredge2mqtt

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: everlab-secrets

  target:
    name: mosquitto-auth
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: mosquitto/auth
        property: username

    - secretKey: password
      remoteRef:
        key: mosquitto/auth
        property: password
