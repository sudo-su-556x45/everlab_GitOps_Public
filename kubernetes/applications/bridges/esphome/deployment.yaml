apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: esphome
  labels:
    app.kubernetes.io/name: esphome
    app.kubernetes.io/part-of: bridges
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: esphome

  template:
    metadata:
      labels:
        app.kubernetes.io/name: esphome
        app.kubernetes.io/part-of: bridges

    spec:
      automountServiceAccountToken: false

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:2026.8.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 6052
              protocol: TCP

          env:
            - name: TZ
              value: America/Denver

          volumeMounts:
            - name: config
              mountPath: /config

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: esphome-config
