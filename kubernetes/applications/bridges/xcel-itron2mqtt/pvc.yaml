apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xcel-itron2mqtt-certs
  namespace: xcel-itron2mqtt
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: nfs

  resources:
    requests:
      storage: 1Gi
