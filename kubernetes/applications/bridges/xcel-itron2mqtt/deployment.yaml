apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcel-itron2mqtt
  namespace: xcel-itron2mqtt

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: xcel-itron2mqtt

  template:
    metadata:
      labels:
        app.kubernetes.io/name: xcel-itron2mqtt

    spec:
      initContainers:
        - name: generate-certificates
          image: ghcr.io/zaknye/xcel_itron2mqtt:latest
          imagePullPolicy: IfNotPresent

          args:
            - print-lfdi

          volumeMounts:
            - name: certs
              mountPath: /opt/xcel_itron2mqtt/certs

      containers:
        - name: xcel-itron2mqtt
          image: ghcr.io/zaknye/xcel_itron2mqtt:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: MQTT_SERVER
              value: mosquitto.mosquitto.svc.cluster.local

            - name: MQTT_PORT
              value: "1883"

            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: username

            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: password

            - name: MQTT_TOPIC_PREFIX
              value: homeassistant

            - name: METER_IP
              value: "192.168.30.10"

            - name: METER_PORT
              value: "8081"

            - name: LOGLEVEL
              value: INFO

          resources:
            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: certs
              mountPath: /opt/xcel_itron2mqtt/certs

      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: xcel-itron2mqtt-certs
