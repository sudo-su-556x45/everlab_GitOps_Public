apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media
spec:
  capacity:
    storage: 50Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: plex-media-static

  mountOptions:
    - nfsvers=4.2
    - hard
    - timeo=600
    - retrans=2

  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: plex-media
    volumeAttributes:
      server: 192.168.21.121
      share: /plex
