apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: plex-lan
  namespace: plex
  labels:
    app.kubernetes.io/name: plex

spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens18.10",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.10.50/24"
          }
        ],
        "routes": [
          {
            "dst": "192.168.0.0/24",
            "gw": "192.168.10.1"
          }
        ]
      }
    }
