apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: everlab-ipa
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  acme:
    server: https://prod-ipa-01.local.everlab.dev/acme/directory

    caBundle: ""

    privateKeySecretRef:
      name: everlab-ipa-acme-account

    solvers:
      - dns01:
          rfc2136:
            nameserver: 192.168.10.103:53
            tsigKeyName: external-dns.prod.everlab.dev.
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: external-dns-tsig
              key: tsig-secret
