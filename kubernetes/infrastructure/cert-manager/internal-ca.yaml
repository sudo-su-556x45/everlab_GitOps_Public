apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: everlab-selfsigned-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: everlab-internal-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: EverLab Internal Root CA
  secretName: everlab-internal-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Never
  subject:
    organizations:
      - EverLab
  issuerRef:
    name: everlab-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: everlab-internal-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ca:
    secretName: everlab-internal-root-ca
