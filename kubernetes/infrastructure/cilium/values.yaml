# Cilium 1.19.6
#
# This file contains intentional overrides only.
# Do not copy the complete output of:
#   helm get values cilium -a

cluster:
  name: kubernetes

kubeProxyReplacement: true

routingMode: native
ipv4NativeRoutingCIDR: 10.0.0.0/8
autoDirectNodeRoutes: true

endpointRoutes:
  enabled: true

ipam:
  mode: kubernetes

cni:
  exclusive: false

l2announcements:
  enabled: true

gatewayAPI:
  enabled: true
  enableAppProtocol: true

envoy:
  enabled: true

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

loadBalancer:
  l7:
    backend: envoy

bgpControlPlane:
  enabled: false

devices:
  - "ens18.11"
  - "ens18.12"

k8sServiceHost: 192.168.11.100
k8sServicePort: 6443

operator:
  replicas: 1

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
