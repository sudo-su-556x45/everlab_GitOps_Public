apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: everlab-public-wildcard
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  secretName: everlab-public-wildcard-tls

  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod

  dnsNames:
    - everlab.dev
    - "*.everlab.dev"
