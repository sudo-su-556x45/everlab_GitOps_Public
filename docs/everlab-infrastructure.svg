<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Everlab production infrastructure</title>
  <desc id="desc">Two Proxmox servers hosting a seven-node Kubernetes cluster, pfSense, FreeIPA, ZFS storage, GPUs, and USB radio controllers.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101f35"/>
    </linearGradient>
    <linearGradient id="pve0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a5e"/>
      <stop offset="1" stop-color="#102b49"/>
    </linearGradient>
    <linearGradient id="pve1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21433f"/>
      <stop offset="1" stop-color="#12312f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 19px Inter, system-ui, sans-serif; fill: #a9bdd5; }
      .host-name { font: 700 30px Inter, system-ui, sans-serif; fill: #fff; }
      .host-model { font: 600 17px Inter, system-ui, sans-serif; fill: #8ed7ff; }
      .host-spec { font: 500 16px Inter, system-ui, sans-serif; fill: #d7e4f1; }
      .section { font: 700 16px Inter, system-ui, sans-serif; fill: #89dbca; letter-spacing: 1.5px; }
      .vm-name { font: 700 17px Inter, system-ui, sans-serif; fill: #f8fafc; }
      .vm-role { font: 500 14px Inter, system-ui, sans-serif; fill: #9fb5ca; }
      .vm-spec { font: 600 14px Inter, system-ui, sans-serif; fill: #dce8f3; }
      .device { font: 700 13px Inter, system-ui, sans-serif; fill: #07111f; }
      .note { font: 500 14px Inter, system-ui, sans-serif; fill: #b7c7d8; }
      .storage { font: 700 15px Inter, system-ui, sans-serif; fill: #ffe6a6; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <circle cx="1450" cy="70" r="230" fill="#1a4264" opacity="0.18"/>
  <circle cx="80" cy="980" r="280" fill="#1f655d" opacity="0.12"/>

  <text x="80" y="76" class="title">Everlab Production Infrastructure</text>
  <text x="80" y="110" class="subtitle">Proxmox compute • Kubernetes application platform • retained ZFS-backed data</text>

  <rect x="65" y="155" width="720" height="720" rx="24" fill="url(#pve0)" stroke="#3f79a8" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="205" class="host-name">pve0</text>
  <text x="100" y="235" class="host-model">Dell PowerEdge R730xd</text>
  <text x="100" y="270" class="host-spec">32 × Intel Xeon E5-2667 v3 @ 3.20 GHz • 2 sockets • 125 GB RAM</text>

  <rect x="100" y="292" width="650" height="55" rx="12" fill="#0d2035" stroke="#436d91"/>
  <text x="122" y="325" class="storage">◉ 6.55 TB RAIDZ1 — application data</text>

  <text x="100" y="390" class="section">VIRTUAL MACHINES</text>

  <rect x="100" y="410" width="305" height="96" rx="14" fill="#0b1a2a" stroke="#4d7599"/>
  <text x="122" y="442" class="vm-name">pfSense</text>
  <text x="122" y="468" class="vm-role">Firewall, routing, and VLAN gateway</text>

  <rect x="425" y="410" width="325" height="96" rx="14" fill="#0b1a2a" stroke="#4d7599"/>
  <text x="447" y="442" class="vm-name">prod-ipa-01</text>
  <text x="447" y="468" class="vm-role">FreeIPA identity and DNS services</text>

  <rect x="100" y="526" width="650" height="72" rx="14" fill="#0b1a2a" stroke="#6aa6d2"/>
  <text x="122" y="555" class="vm-name">prod-k8m-01</text>
  <text x="122" y="580" class="vm-role">Kubernetes control plane</text>
  <text x="600" y="566" class="vm-spec">4 vCPU • 8 GB</text>

  <rect x="100" y="618" width="650" height="72" rx="14" fill="#0b1a2a" stroke="#6aa6d2"/>
  <text x="122" y="647" class="vm-name">prod-k8w-01</text>
  <text x="122" y="672" class="vm-role">Kubernetes worker</text>
  <text x="470" y="648" class="vm-spec">12 vCPU • 24 GB</text>
  <rect x="617" y="634" width="111" height="26" rx="13" fill="#f6c85f"/>
  <text x="631" y="652" class="device">Quadro P1000</text>

  <rect x="100" y="710" width="315" height="105" rx="14" fill="#0b1a2a" stroke="#6aa6d2"/>
  <text x="122" y="741" class="vm-name">prod-k8w-02</text>
  <text x="122" y="766" class="vm-role">Kubernetes worker</text>
  <text x="122" y="793" class="vm-spec">12 vCPU • 24 GB</text>

  <rect x="435" y="710" width="315" height="105" rx="14" fill="#0b1a2a" stroke="#6aa6d2"/>
  <text x="457" y="741" class="vm-name">prod-k8w-03</text>
  <text x="457" y="766" class="vm-role">Kubernetes worker</text>
  <text x="457" y="793" class="vm-spec">12 vCPU • 24 GB</text>

  <rect x="815" y="155" width="720" height="720" rx="24" fill="url(#pve1)" stroke="#438077" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="205" class="host-name">pve1</text>
  <text x="850" y="235" class="host-model">Proxmox compute and storage node</text>
  <text x="850" y="270" class="host-spec">56 × Intel Xeon E5-2680 v4 @ 2.40 GHz • 2 sockets • 125 GB RAM</text>

  <rect x="850" y="292" width="650" height="55" rx="12" fill="#102523" stroke="#4f827b"/>
  <text x="872" y="325" class="storage">◉ 43.7 TB RAIDZ2</text>

  <text x="850" y="390" class="section">KUBERNETES WORKER VMS</text>

  <rect x="850" y="410" width="650" height="112" rx="14" fill="#0d201f" stroke="#64a49a"/>
  <text x="872" y="444" class="vm-name">prod-k8w-04</text>
  <text x="872" y="472" class="vm-role">Kubernetes worker</text>
  <text x="1288" y="459" class="vm-spec">16 vCPU • 32 GB</text>
  <text x="872" y="500" class="vm-role">No hostname-bound passthrough device is documented in Git</text>

  <rect x="850" y="542" width="650" height="112" rx="14" fill="#0d201f" stroke="#64a49a"/>
  <text x="872" y="576" class="vm-name">prod-k8w-05</text>
  <text x="872" y="604" class="vm-role">Kubernetes worker</text>
  <text x="1288" y="591" class="vm-spec">16 vCPU • 32 GB</text>
  <text x="872" y="632" class="vm-role">No hostname-bound passthrough device is documented in Git</text>

  <rect x="850" y="674" width="650" height="112" rx="14" fill="#0d201f" stroke="#64a49a"/>
  <text x="872" y="708" class="vm-name">prod-k8w-06</text>
  <text x="872" y="736" class="vm-role">Kubernetes worker</text>
  <text x="1288" y="723" class="vm-spec">16 vCPU • 32 GB</text>
  <text x="872" y="764" class="vm-role">No hostname-bound passthrough device is documented in Git</text>

  <rect x="65" y="910" width="1470" height="100" rx="20" fill="#0b1727" stroke="#2e526f"/>
  <text x="95" y="943" class="section">CLUSTER HARDWARE PLACEMENT</text>
  <rect x="95" y="960" width="170" height="28" rx="14" fill="#f6c85f"/>
  <text x="111" y="979" class="device">P1000 • prod-k8w-01</text>
  <rect x="285" y="960" width="240" height="28" rx="14" fill="#7bdff2"/>
  <text x="301" y="979" class="device">RTX A2000 12 GB • GPU label</text>
  <rect x="545" y="960" width="278" height="28" rx="14" fill="#89dbca"/>
  <text x="561" y="979" class="device">Zigbee USB • radio-controller label</text>
  <rect x="843" y="960" width="276" height="28" rx="14" fill="#89dbca"/>
  <text x="859" y="979" class="device">Z-Wave USB • radio-controller label</text>
  <text x="1145" y="978" class="note">Label-selected VM names are not encoded in Git.</text>
</svg>
